name: Research pipeline and Pages
on:
  push:
    branches: [main]
  public:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: research-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked presentation dependencies
        run: npm ci
        working-directory: experiments/visual_report
      - name: Reconstruct research data and build the report
        run: python3 tools/build_site.py
      - name: Verify source identities, aggregates and website artifact
        run: python3 tools/verify_repository.py
      - name: Save portable static report
        uses: actions/upload-artifact@v7
        with:
          name: chemgpt-rl-report
          path: docs/
          if-no-files-found: error
          retention-days: 7
      - name: Configure Pages
        if: github.event.repository.private == false && github.event_name != 'public'
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        if: github.event.repository.private == false && github.event_name != 'public'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
  deploy:
    if: github.event.repository.private == false && github.event_name != 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified research report
        id: deployment
        uses: actions/deploy-pages@v5
